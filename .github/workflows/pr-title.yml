name: reusable / pr-title

# Plain regex, deliberately not a third-party action — same "transparent,
# dependency-free check" philosophy as install-and-run-gitleaks. Assumes the
# caller squash-merges, so the PR title becomes the commit subject.
# No composite actions used here, so no pinning/checkout question applies.

on:
  workflow_call:
    inputs:
      title:
        description: 'Caller passes github.event.pull_request.title'
        type: string
        required: true

jobs:
  pr-title:
    name: title
    runs-on: ubuntu-latest
    steps:
      - name: '[validation] enforce conventional commit title'
        shell: bash
        env:
          TITLE: ${{ inputs.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
          if ! echo "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title '$TITLE' does not match Conventional Commits format: $pattern"
            exit 1
          fi
