name: setup-toolchain
description: >
  Install the calling repo's JS toolchain, whichever it uses: Bun, or Node
  with pnpm or npm. Consumers are expected to expose the same package.json
  script names (format:check/lint/typecheck/test/build) whatever the
  runtime, so this only needs to land the right runtime and install deps —
  the actual script invocation is a plain `run:` line in the caller.

inputs:
  runtime:
    description: 'bun or node'
    required: true
  package-manager:
    description: 'bun, pnpm, or npm'
    required: true
  bun-version:
    description: 'Bun version (only used when runtime: bun)'
    required: false
    default: '1.3.14'
  node-version:
    description: 'Node version (only used when runtime: node)'
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: '[preparation] set up bun'
      if: inputs.runtime == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: '[preparation] set up pnpm'
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: '[preparation] set up node'
      if: inputs.runtime == 'node'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager == 'pnpm' && 'pnpm' || (inputs.package-manager == 'npm' && 'npm' || '') }}

    - name: '[preparation] install dependencies (bun)'
      if: inputs.package-manager == 'bun'
      shell: bash
      run: bun install --frozen-lockfile

    - name: '[preparation] install dependencies (pnpm)'
      if: inputs.package-manager == 'pnpm'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: '[preparation] install dependencies (npm)'
      if: inputs.package-manager == 'npm'
      shell: bash
      run: npm ci
