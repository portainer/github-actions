name: package-and-push-chart
description: >
  Package a Helm chart, forcing its version/appVersion to a given value, and
  push it as an OCI artifact. Its only caller is publish-chart.yml, which
  serves both purposes from one path rather than two pipelines: a real
  release passes the released semver and oci://ghcr.io/portainer/charts,
  while a push to develop/release/** or a pre-release dispatch (never a
  PR's own commits) publishes a dev/test chart to the separate
  oci://ghcr.io/portainer/dev-charts path, so the two can never collide.
  publish-chart.yml works out the version and stages the chart (pointing a
  dev chart at its CI image) before calling this.

  Last line of defence for the reserved dev-charts.portainer.io/ annotation
  prefix: the packaged chart is inspected right before the push, and the
  push fails if it carries any such annotation and the destination is the
  release registry, or the caller didn't allow them (only a pre-release
  does).

inputs:
  chart-path:
    description: 'Path to the chart directory'
    required: false
    default: 'chart/'
  version:
    description: 'Chart version AND appVersion to force (SemVer-shaped, e.g. 1.2.3)'
    required: true
  oci-registry:
    description: 'OCI destination to push to'
    required: false
    default: 'oci://ghcr.io/portainer/charts'
  registry-token:
    description: 'Caller passes secrets.GITHUB_TOKEN (or another token with packages:write on the destination)'
    required: true
  allow-dev-annotations:
    description: 'true only for a pre-release dev chart, the one chart allowed to carry dev-charts.portainer.io/ annotations'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: '[preparation] set up helm'
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

    - name: '[preparation] log in to ghcr.io'
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

    - name: '[execution] package chart'
      shell: bash
      env:
        CHART_PATH: ${{ inputs.chart-path }}
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p /tmp/chart-dist
        helm package "$CHART_PATH" \
          --version "$VERSION" \
          --app-version "$VERSION" \
          -d /tmp/chart-dist

    - name: '[validation] no dev-only annotations outside a pre-release'
      shell: bash
      env:
        OCI_REGISTRY: ${{ inputs.oci-registry }}
        ALLOW: ${{ inputs.allow-dev-annotations }}
      run: |
        set -euo pipefail
        registry="${OCI_REGISTRY%/}"
        for pkg in /tmp/chart-dist/*.tgz; do
          found=$(helm show chart "$pkg" | yq -r '(.annotations // {}) | keys | .[] | select(test("^dev-charts\\.portainer\\.io/"))')
          [ -n "$found" ] || continue
          if [ "$registry" = oci://ghcr.io/portainer/charts ] || [[ "$registry" == oci://ghcr.io/portainer/charts/* ]] || [ "$ALLOW" != true ]; then
            echo "::error::$(basename "$pkg") carries dev-only annotations ($(echo $found)) and is bound for $registry; refusing to push."
            exit 1
          fi
        done

    - name: '[execution] push chart'
      shell: bash
      env:
        OCI_REGISTRY: ${{ inputs.oci-registry }}
      run: helm push /tmp/chart-dist/*.tgz "$OCI_REGISTRY"
